name: Pages

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Generate stats
      uses: cicirello/user-statistician@v1
      with:
        colors: onedark
        include-title: false
        commit-and-push: false
        locale: de
        fail-on-error: true
        featured-repository: 'muTau-RV32-SoC'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Move stats
      run: mv images/userstats.svg ./assets/stats.svg
    
    - name: Upload stats artifact
      uses: actions/upload-artifact@v4
      with:
        name: stats
        path: ./assets/stats.svg

  generate-trophy:
    runs-on: ubuntu-latest
    steps:
    - name: Generate trophy
      uses: Erik-Donath/github-profile-trophy@master
      with:
        username: ${{ github.actor }}
        output_path: ./assets/trophy.svg
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload trophy artifact
      uses: actions/upload-artifact@v4
      with:
        name: trophy
        path: ./assets/trophy.svg

  page:
    runs-on: ubuntu-latest
    needs: 
    - generate-stats
    - generate-trophy
    steps:
    - uses: actions/checkout@v4
    
    - name: Download stats
      uses: actions/download-artifact@v4
      with:
        name: stats
        path: ./assets
    
    - name: Download trophy
      uses: actions/download-artifact@v4
      with:
        name: trophy
        path: ./assets
    
    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v5
    
    - name: Build with Jekyll
      uses: actions/jekyll-build-pages@v1
      with:
        source: ./
        destination: ./_site
    
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [page]
    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
