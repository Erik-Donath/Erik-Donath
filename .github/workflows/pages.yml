name: Pages

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Generate stats
      uses: cicirello/user-statistician@v1
      with:
        colors: onedark
        include-title: false
        commit-and-push: false
        locale: de
        fail-on-error: true
        featured-repository: 'muTau-RV32-SoC'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Move stats
      run: mv images/userstats.svg ./assets/stats.svg
    
    - name: Upload stats artifact
      uses: actions/upload-artifact@v4
      with:
        name: stats
        path: ./assets/stats.svg
  
  generate-trophy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo (so the generator script is available)
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Checkout trophy project
      uses: actions/checkout@v4
      with:
        repository: ryo-ma/github-profile-trophy
        path: trophy
        ref: 97e9fad67971e2558d58a6284f368220cd8552a1

    - name: Setup Deno
      uses: denoland/setup-deno@v1
      with:
        deno-version: v1.x

    - name: Ensure assets directory exists
      run: mkdir -p ./assets

    - name: Generate trophy SVG
      env:
        GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
      run: |
        deno run --allow-net --allow-env --allow-read --allow-write .github/workflows/generate_trophy.ts "${{ github.actor }}" "${{ github.workspace }}/assets/trophy.svg"

    - name: Upload trophy artifact
      uses: actions/upload-artifact@v4
      with:
        name: trophy
        path: ./assets/trophy.svg

  page:
    runs-on: ubuntu-latest
    needs: generate-stats
    steps:
    - uses: actions/checkout@v4
    
    - name: Download stats
      uses: actions/download-artifact@v4
      with:
        name: stats
        path: ./assets
    
    - name: Download trophy
      uses: actions/download-artifact@v4
      with:
        name: trophy
        path: ./assets
    
    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v5
    
    - name: Build with Jekyll
      uses: actions/jekyll-build-pages@v1
      with:
        source: ./
        destination: ./_site
    
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [page]
    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
