name: Pages

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check-rate-limit:
    runs-on: ubuntu-latest
    steps:
    - name: Check GitHub API rate limit
      id: rate_limit
      run: |
        RATE_LIMIT_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/rate_limit)
        REMAINING=$(echo "$RATE_LIMIT_RESPONSE" | jq '.rate_limit.remaining')
        LIMIT=$(echo "$RATE_LIMIT_RESPONSE" | jq '.rate_limit.limit')
        RESET=$(echo "$RATE_LIMIT_RESPONSE" | jq '.rate_limit.reset')
        
        echo "remaining=$REMAINING" >> $GITHUB_OUTPUT
        echo "limit=$LIMIT" >> $GITHUB_OUTPUT
        echo "reset=$RESET" >> $GITHUB_OUTPUT
        
        echo "API Rate Limit Status:"
        echo "  Remaining: $REMAINING / $LIMIT"
        echo "  Reset at: $(date -d @$RESET)"
        
        if [ "$REMAINING" -lt 10 ]; then
          echo "::warning::GitHub API rate limit is critically low ($REMAINING remaining). Workflow will be cancelled."
          exit 1
        fi

  generate-stats:
    runs-on: ubuntu-latest
    needs: check-rate-limit
    steps:
    - uses: actions/checkout@v4
    
    - name: Generate stats
      uses: cicirello/user-statistician@v1
      with:
        colors: onedark
        include-title: false
        commit-and-push: false
        locale: de
        fail-on-error: true
        featured-repository: 'muTau-RV32-SoC'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Move stats
      run: mv images/userstats.svg ./assets/stats.svg
    
    - name: Upload stats artifact
      uses: actions/upload-artifact@v4
      with:
        name: stats
        path: ./assets/stats.svg

  generate-trophy:
    runs-on: ubuntu-latest
    needs: check-rate-limit
    steps:
    - uses: actions/checkout@v4
    
    - name: Generate trophy
      uses: ryo-ma/github-profile-trophy@master
      with:
        username: ${{ github.actor }}
        output_path: ./assets/trophy.svg
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload trophy artifact
      uses: actions/upload-artifact@v4
      with:
        name: trophy
        path: ./assets/trophy.svg

  page:
    runs-on: ubuntu-latest
    needs: 
    - generate-stats
    - generate-trophy
    steps:
    - uses: actions/checkout@v4
    
    - name: Download stats
      uses: actions/download-artifact@v4
      with:
        name: stats
        path: ./assets
    
    - name: Download trophy
      uses: actions/download-artifact@v4
      with:
        name: trophy
        path: ./assets
    
    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v5
    
    - name: Build with Jekyll
      uses: actions/jekyll-build-pages@v1
      with:
        source: ./
        destination: ./_site
    
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [page]
    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
